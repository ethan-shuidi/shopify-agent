[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-local-agent"
version = "0.1.0"
description = "A lightweight local PydanticAI agent connected to Feishu over WebSocket."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lark-oapi>=1.4,<2",
  "pydantic-ai-slim[openai]>=1,<2",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
feishu-local-agent = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
